{{ template "header.html" . }}

<div class="nb-card">
    <h1 class="nb-heading" data-i18n="Sign in">Sign in</h1>
    <p class="nb-subheading" data-i18n="Enter your credentials">Enter your credentials</p>

    <form method="post" action="{{ .PostURL }}">
        {{ if .Invalid }}
        <div class="nb-error">
            <span data-i18n="Invalid">Invalid</span> {{ .UsernamePrompt }} <span data-i18n="or password">or password</span>.
        </div>
        {{ end }}

        <div class="nb-form-group">
            <label class="nb-label" for="login" data-i18n-label="{{ .UsernamePrompt }}">{{ .UsernamePrompt }}</label>
            <input
                type="text"
                id="login"
                name="login"
                class="nb-input"
                autocomplete="username"
                placeholder="Enter your {{ .UsernamePrompt | lower }}"
                data-i18n-placeholder="Enter your email address"
                {{ if .Username }}value="{{ .Username }}"{{ else }}autofocus{{ end }}
                required
            >
        </div>

        <div class="nb-form-group">
            <label class="nb-label" for="password" data-i18n-label="Password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                class="nb-input"
                autocomplete="current-password"
                placeholder="Enter your password"
                data-i18n-placeholder="Enter your password"
                {{ if .Invalid }}autofocus{{ end }}
                required
            >
        </div>

        <button type="submit" id="submit-login" class="nb-btn" data-i18n-btn="Sign in">
            Sign in
        </button>
    </form>

    {{ if .BackLink }}
    <div class="nb-back-link">
        <a href="{{ .BackLink }}" class="nb-link" data-i18n="Choose another login method">Choose another login method</a>
    </div>
    {{ end }}
</div>

<script>
document.querySelector('form').onsubmit = function() {
    document.getElementById('submit-login').disabled = true;
};
</script>

{{ template "footer.html" . }}
