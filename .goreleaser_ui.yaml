version: 2
env:
  - SKIP_PUBLISH={{ if index .Env "SKIP_PUBLISH" }}{{ .Env.SKIP_PUBLISH }}{{ else }}true{{ end }}
project_name: cloink-ui

before:
  hooks:
    # Bindings are gitignored; regenerate before the frontend build so
    # the @wailsio/runtime Vite plugin can resolve them (vite refuses to
    # build without them).
    - sh -c 'cd client/ui && wails3 generate bindings -clean=true -ts'
    - sh -c 'cd client/ui/frontend && pnpm install --frozen-lockfile && pnpm build'

builds:
  - id: cloink-ui
    dir: client/ui
    binary: cloink-ui
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

  - id: cloink-ui-windows-amd64
    dir: client/ui
    binary: cloink-ui
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

  - id: cloink-ui-windows-arm64
    dir: client/ui
    binary: cloink-ui
    env:
      - CGO_ENABLED=1
      - CC=aarch64-w64-mingw32-clang
      - CXX=aarch64-w64-mingw32-clang++
    goos:
      - windows
    goarch:
      - arm64
    ldflags:
      - -s -w -X github.com/netbirdio/netbird/version.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
      - -H windowsgui
    mod_timestamp: "{{ .CommitTimestamp }}"
    tags:
      - production

archives:
  - id: linux-arch
    name_template: "{{ .ProjectName }}-linux_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - cloink-ui
  - id: windows-arch
    name_template: "{{ .ProjectName }}-windows_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds:
      - cloink-ui-windows-amd64
      - cloink-ui-windows-arm64

nfpms:
  - maintainer: Kunlun-Hub <674904341@qq.com>
    description: Cloink desktop client.
    homepage: https://github.com/Kunlun-Hub
    license: BSD-3-Clause
    vendor: Cloink
    id: cloink_ui_deb
    package_name: cloink-ui
    builds:
      - cloink-ui
    formats:
      - deb
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/linux/cloink-ui.desktop
        dst: /usr/share/applications/io.cloink.client.desktop
      - src: client/ui/build/appicon.png
        dst: /usr/share/pixmaps/cloink-ui.png
    dependencies:
      - cloink (>= 0.77.0)
      - libgtk-4-1 (>= 4.14)
      - libwebkitgtk-6.0-4
      - xdg-utils

  - maintainer: Kunlun-Hub <674904341@qq.com>
    description: Cloink desktop client.
    homepage: https://github.com/Kunlun-Hub
    license: BSD-3-Clause
    vendor: Cloink
    id: cloink_ui_rpm
    package_name: cloink-ui
    builds:
      - cloink-ui
    formats:
      - rpm
    scripts:
      postinstall: "release_files/ui-post-install.sh"
    contents:
      - src: client/ui/build/linux/cloink-ui.desktop
        dst: /usr/share/applications/io.cloink.client.desktop
      - src: client/ui/build/appicon.png
        dst: /usr/share/pixmaps/cloink-ui.png
    dependencies:
      - cloink >= 0.77.0
      - (gtk4 >= 4.14 or libgtk-4-1 >= 4.14)
      - (webkitgtk6.0 or libwebkitgtk-6_0-4)
      - xdg-utils

    rpm:
      signature:
        key_file: '{{ if index .Env "GPG_RPM_KEY_FILE" }}{{ .Env.GPG_RPM_KEY_FILE }}{{ end }}'

release:
  # Uploads into the release created by the main .goreleaser.yaml run.
  # make_latest stays false everywhere: the signing pipeline
  # The Cloink signing pipeline marks the release latest after the Windows
  # and macOS artifacts are signed.
  make_latest: false
  prerelease: auto
